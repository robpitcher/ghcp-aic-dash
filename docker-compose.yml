# Local container wiring for the AI Credit Dashboard.
#
# Demo (default, no credentials and no .env required):
#   docker compose up --build
#
# Configured (copy .env.example to .env and fill in real values first):
#   docker compose --profile configured up --build app
#
# Name the `app` service explicitly: `demo` has no profile, so an untargeted
# `up` would also start it and collide on port 3000.
services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo
      args:
        # Set NPM_REGISTRY in .env when registry.npmjs.org is blocked on your network.
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: ghcp-aic-dash:demo
    ports:
      - "3000:3000"
    environment:
      # Synthetic data only: no GitHub calls and no credentials.
      DEMO_ENV: "true"
      APP_BASE_URL: http://localhost:3000

  app:
    # Started only with: docker compose --profile configured up --build app
    profiles:
      - configured
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set NPM_REGISTRY in .env when registry.npmjs.org is blocked on your network.
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: ghcp-aic-dash:local
    ports:
      - "3000:3000"
    environment:
      # Identity (GitHub App — proves the developer's login only).
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      # Privileged, server-side only — never exposed to the browser.
      GITHUB_BILLING_TOKEN: ${GITHUB_BILLING_TOKEN}
      GITHUB_ENTERPRISE_SLUG: ${GITHUB_ENTERPRISE_SLUG}
      GITHUB_BILLING_SCOPE: ${GITHUB_BILLING_SCOPE:-enterprise}
      REQUIRE_ENTERPRISE_MEMBERSHIP: ${REQUIRE_ENTERPRISE_MEMBERSHIP:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
    env_file:
      - .env
    restart: unless-stopped
