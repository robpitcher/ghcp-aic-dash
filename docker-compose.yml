# Local container wiring for the AI Credit Dashboard.
#
# Configured (default) — uses the real values in `.env`:
#   docker compose up --build
#
# Demo — credential-free synthetic data, ignores `.env` entirely:
#   docker compose --profile demo up --build
#
# Demo mode is opt-in at the command line on purpose: nothing in `.env`
# selects it, so a configured deployment can never fall back to synthetic data
# by accident, and the demo container can never be influenced by a stray value
# in `.env`.
#
# Stopping either mode needs the wildcard, because a plain `docker compose
# down` only targets the profile currently active:
#   docker compose --profile "*" down
#
# `app` uses the empty profile `[""]`, a documented Compose feature
# (docs.docker.com/compose/how-tos/profiles/) meaning "start by default, but
# step aside when another profile is active". That is what lets `--profile
# demo` swap the services cleanly instead of starting both and colliding on
# port 3000.
#
# The two modes are separate services by necessity, not style: isDemoMode() in
# src/lib/config.ts refuses to activate when NODE_ENV=production, so demo mode
# needs its own image built from the Dockerfile's `demo` stage.
services:
  app:
    profiles: [""]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional override. Leave unset to inherit the npmrc secret below.
        NPM_REGISTRY: ${NPM_REGISTRY:-}
      secrets:
        - npmrc
    image: ghcp-aic-dash:local
    ports:
      - "3000:3000"
    environment:
      # Identity (GitHub App — proves the developer's login only).
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      # Privileged, server-side only — never exposed to the browser.
      GITHUB_BILLING_TOKEN: ${GITHUB_BILLING_TOKEN}
      GITHUB_ENTERPRISE_SLUG: ${GITHUB_ENTERPRISE_SLUG}
      GITHUB_BILLING_SCOPE: ${GITHUB_BILLING_SCOPE:-enterprise}
      REQUIRE_ENTERPRISE_MEMBERSHIP: ${REQUIRE_ENTERPRISE_MEMBERSHIP:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
      # Optional IssueOps destination. Empty fails the min(1) schema check, so
      # an unset value correctly reads as "budget requests not configured".
      BUDGET_REQUEST_REPOSITORY: ${BUDGET_REQUEST_REPOSITORY:-}
    # No env_file: this explicit list is the runtime allowlist. Compose still
    # reads `.env` automatically for the ${VAR} interpolation above, so adding
    # a new runtime variable is a deliberate edit here rather than anything in
    # `.env` silently reaching the container — including build-time values
    # like NPM_REGISTRY.
    restart: unless-stopped

  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
      target: demo
      args:
        # Optional override. Leave unset to inherit the npmrc secret below.
        NPM_REGISTRY: ${NPM_REGISTRY:-}
      secrets:
        - npmrc
    image: ghcp-aic-dash:demo
    ports:
      - "3000:3000"
    environment:
      # Synthetic data only: no GitHub calls and no credentials. This service
      # has no env_file and interpolates nothing, so `.env` never reaches it.
      DEMO_ENV: "true"
      APP_BASE_URL: http://localhost:3000

# The build reads your existing npm configuration rather than duplicating it in
# `.env`, so a corporate feed (and any credentials in that file) is used by
# `npm ci` without being written into the image. It is mounted only for that
# build step. Override the location with NPM_CONFIG_USERCONFIG — the same
# variable npm itself honours — and set it to ./.npmrc if you have no
# user-level file. `npm config get userconfig` prints your current path.
secrets:
  npmrc:
    file: ${NPM_CONFIG_USERCONFIG:-~/.npmrc}
