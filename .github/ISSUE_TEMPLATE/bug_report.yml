name: Bug report
description: Report a reproducible problem in the dashboard
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, secrets, private usage data, or other sensitive information.
        For security vulnerabilities, follow the private reporting process in SECURITY.md and do not disclose details publicly.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, Node.js version, and whether this was demo or configured mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and personal or enterprise billing information before posting.
    validations:
      required: false
