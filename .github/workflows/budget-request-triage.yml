name: Triage AI credit budget requests

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: budget-request-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Triage budget request
        uses: ./.github/actions/budget-issueops
        with:
          operation: triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
